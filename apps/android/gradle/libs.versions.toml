# Every version lives here (05 §1); build scripts never write one. Stable releases only.
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
hilt = "2.60.1"
androidx-hilt = "1.4.0"
compose-bom = "2026.09.00"
activity = "1.13.0"
core-ktx = "1.19.1"
lifecycle = "2.11.0"
navigation = "2.10.2"
room = "2.8.5"
datastore = "1.2.1"
work = "2.12.0"
retrofit = "3.0.0"
okhttp = "5.5.0"
kotlinx-serialization = "1.12.0"
kotlinx-coroutines = "1.11.0"
coil = "3.6.3"
vico = "3.3.1"
camerax = "1.6.2"
mlkit-barcode = "17.3.0"
mlkit-document-scanner = "16.0.0"
mlkit-subject-segmentation = "16.0.0-beta1"  # beta API; optional in E1 (05 §1)
firebase-bom = "35.0.2"
