packages:
  - apps/api
  - apps/web
  - packages/*

# Exact versions only; every shared version lives in the catalog below.
savePrefix: ''

# Do not install releases younger than one day (supply-chain protection).
minimumReleaseAge: 1440

# Dependency build scripts are blocked unless reviewed and listed here.
allowBuilds:
  esbuild: true
  workerd: true

catalog:
  '@cloudflare/vitest-plugin': 1.3.7
  '@eslint/js': 10.0.1
  '@types/node': 24.19.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  eslint: 10.12.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7
  globals: 17.13.0
  prettier: 3.9.9
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 6.0.3
  typescript-eslint: 8.71.1
  uuid: 14.0.2
  vite: 8.3.3
  vitest: 4.1.11
  wrangler: 4.148.0
  zod: 4.6.5
