name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - name: Generated design tokens are up to date
        run: pnpm tokens && git diff --exit-code
      # The Worker serves apps/web/dist as static assets; typecheck and tests use the real build.
      - run: pnpm --filter web build
      - run: pnpm typecheck
      - run: pnpm test

  android:
    runs-on: ubuntu-latest
    env:
      # Empty until T-004 (and always on pull requests from forks): the app builds without it.
      GOOGLE_SERVICES_JSON_DEV: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Write google-services.json (dev)
        if: env.GOOGLE_SERVICES_JSON_DEV != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON_DEV" > app/src/dev/google-services.json
      - run: ./gradlew checkModuleDependencies unitTests lintDevDebug

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no floating major tags)
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
