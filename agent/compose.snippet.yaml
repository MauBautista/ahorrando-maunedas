# agent/compose.snippet.yaml — pegar en el compose del servidor (07 §12)
services:
  maunedas-agent:
    build:
      context: ./ahorrando-maunedas
      dockerfile: agent/Dockerfile
    restart: unless-stopped
    env_file: ./ahorrando-maunedas/agent/.env
    volumes:
      - ./data/maunedas:/data
    mem_limit: 1200m # spike B: pico de Chromium 759 MB; Playwright solo como último recurso
    cpus: 1.5
    shm_size: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
