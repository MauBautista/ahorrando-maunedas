[project]
name = "maunedas-agent"
version = "0.1.0"
description = "Agente del servidor casero: scraping, imágenes y respaldos (SDD 07)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "h2==4.4.1",
    "httpx==0.28.1",
    "pydantic-settings==2.16.0",
    "selectolax==1.0.1",
    "structlog==26.1.0",
]

[project.optional-dependencies]
# Same version as the Docker image (playwright/python:v1.63.0-noble), the one spike B validated (07 §12).
browser = ["playwright==1.63.0"]
# The home enhancement's own container (T-300, decisión T105): the versions spike A measured on the A8-7410.
images = ["onnxruntime==1.31.0", "pillow==13.0.0", "rembg==2.0.86"]

[dependency-groups]
dev = [
    "pillow==13.0.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
